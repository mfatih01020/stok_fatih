<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Compare</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">
    <link rel="shortcut icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" href="/static/favicon.png">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="QR Compare">
    <meta name="theme-color" content="#0f172a">
    <!-- Google Fonts Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/html5-qrcode.min.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-dark);
            overflow: hidden;
        }

        .login-card-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 10;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-brand i {
            font-size: 3rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.4));
        }

        .login-brand h1 {
            font-family: var(--font-outfit);
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
        }

        .login-brand p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 1.3rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 0.85rem 1.1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #ffffff;
            font-family: var(--font-inter);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-login {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: #ffffff;
            font-family: var(--font-outfit);
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 1.8rem;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.45);
        }

        .login-alert {
            display: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="glass-bg-decor1"></div>
    <div class="glass-bg-decor2"></div>

    <div class="login-card-wrapper">
        <div class="login-brand">
            <i class="fa-solid fa-qrcode"></i>
            <h1>QR Compare</h1>
            <p>Bakanlık BKST Giriş Paneli</p>
        </div>

        <div id="loginAlert" class="login-alert"></div>

        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="form-group">
                <label class="form-label" for="username">
                    <i class="fa-solid fa-user" style="color:#38bdf8;"></i> Bakanlık T.C. / Kullanıcı Adı
                </label>
                <input type="text" id="username" class="form-input" placeholder="T.C. Kimlik Numaranızı girin..." required autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    <i class="fa-solid fa-lock" style="color:#34d399;"></i> Bakanlık Şifresi
                </label>
                <input type="password" id="password" class="form-input" placeholder="BKST şifrenizi girin..." required autocomplete="off">
            </div>

            <button type="submit" id="btnLoginSubmit" class="btn-login">
                <i class="fa-solid fa-right-to-bracket"></i> Giriş Yap ve Kaydet
            </button>
        </form>

        <div style="margin-top: 1.4rem; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.2rem;">
            <p style="font-size: 0.82rem; color: #94a3b8; margin-bottom: 0.75rem;">
                Depo personeli misiniz? Şifre girmeden giriş yapın:
            </p>
            <button type="button" onclick="openWorkerQrScanner()" style="width: 100%; padding: 0.85rem; background: linear-gradient(135deg, #4f46e5, #7c3aed); border: none; border-radius: 12px; color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.35); transition: opacity 0.2s;">
                <i class="fa-solid fa-qrcode" style="font-size: 1.15rem;"></i>
                <span>📷 Personel QR Kodu ile Giriş</span>
            </button>
        </div>
    </div>

    <script>
        async function handleLoginSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('btnLoginSubmit');
            const alertBox = document.getElementById('loginAlert');

            if (!username || !password) {
                showAlert('Lütfen Kullanıcı Adı ve Şifre alanlarını doldurun.', true);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Doğrulanıyor...';
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/api/system/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    if (data.token) {
                        localStorage.setItem('local_session_token', data.token);
                    }
                    sessionStorage.removeItem('app_launch_synced');
                    sessionStorage.setItem('startup_update_checked', 'true');
                    
                    if (data.is_admin) {
                        showAlert('👑 Yönetici girişi başarılı! Admin paneline yönlendiriliyorsunuz...', false);
                        setTimeout(() => {
                            window.location.href = data.redirect || '/admin';
                        }, 600);
                        return;
                    }

                    showAlert('🟢 Giriş başarılı! Yönlendiriliyorsunuz...', false);
                    setTimeout(() => {
                        window.location.href = '/cikis?force_sync=1';
                    }, 800);
                } else {
                    const isUnauth = data.unauthorized || (data.error && (data.error.includes('yetki') || data.error.includes('Yetki')));
                    if (isUnauth) {
                        showAlert(`<div style="display:flex;align-items:center;gap:10px;text-align:left;"><i class="fa-solid fa-ban" style="font-size:1.5rem;color:#ef4444;flex-shrink:0;"></i><div><div style="font-size:0.92rem;font-weight:700;color:#f87171;">UYGULAMA YETKİNİZ BULUNMAMAKTADIR!</div><div style="font-size:0.82rem;color:#cbd5e1;margin-top:2px;">${esc(data.error || 'Bu bayilik hesabının yetkisi bulunmamaktadır. Lütfen sistem yöneticisiyle iletişime geçiniz.')}</div></div></div>`, true);
                    } else {
                        showAlert('❌ ' + (data.error || 'Giriş yapılamadı. Bilgilerinizi kontrol edin.'), true);
                    }
                }
            } catch (err) {
                showAlert('❌ Bağlantı hatası: ' + err.message, true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Giriş Yap ve Kaydet';
            }
        }

        function showAlert(msg, isError) {
            const alertBox = document.getElementById('loginAlert');
            alertBox.style.display = 'block';
            if (isError) {
                alertBox.style.background = 'rgba(239, 68, 68, 0.18)';
                alertBox.style.border = '1px solid rgba(239, 68, 68, 0.45)';
                alertBox.style.color = '#fca5a5';
                alertBox.style.padding = '12px 14px';
                alertBox.style.borderRadius = '14px';
            } else {
                alertBox.style.background = 'rgba(34, 197, 94, 0.18)';
                alertBox.style.border = '1px solid rgba(34, 197, 94, 0.45)';
                alertBox.style.color = '#4ade80';
                alertBox.style.padding = '12px 14px';
                alertBox.style.borderRadius = '14px';
            }
            alertBox.innerHTML = msg;
        }

        function esc(str) {
            return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }



        // Sayfa yüklendiğinde URL parametresini kontrol et
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('error') === 'yetkisiz') {
                showAlert('<div style="display:flex;align-items:center;gap:10px;text-align:left;"><i class="fa-solid fa-triangle-exclamation" style="font-size:1.6rem;color:#ef4444;flex-shrink:0;"></i><div><div style="font-size:0.92rem;font-weight:700;color:#f87171;">UYGULAMA YETKİNİZ BULUNMAMAKTADIR!</div><div style="font-size:0.82rem;color:#cbd5e1;margin-top:2px;">Bayilik erişim yetkiniz yönetici tarafından sonlandırılmıştır. Yetki verilene kadar giriş yapılamaz.</div></div></div>', true);
            }
        });

        // Heartbeat (Sunucunun login ekranındayken kapanmasını önler)
        (function startHeartbeat() {
            function sendPing() {
                fetch('/api/system/heartbeat', { method: 'POST' }).catch(() => {});
            }
            sendPing();
            setInterval(sendPing, 10000);
        })();

        // İlk Açılışta Arka Plan Güncelleme Kontrolü (Login Formu Öncesi)
        (async function checkLoginStartupUpdate() {
            if (sessionStorage.getItem('startup_update_checked')) {
                return;
            }
            sessionStorage.setItem('startup_update_checked', 'true');

            try {
                const res = await fetch('/api/system/check_update');
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.has_update) {
                        showLoginUpdateOverlay(data);
                    }
                }
            } catch (e) {
                console.warn("Login update check error:", e);
            }
        })();

        function showLoginUpdateOverlay(updateInfo) {
            let overlay = document.getElementById('loginUpdateOverlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'loginUpdateOverlay';
                overlay.style.cssText = `
                    position: fixed;
                    top: 0; left: 0; width: 100vw; height: 100vh;
                    background: #0f172a;
                    color: #ffffff;
                    z-index: 9999999;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    font-family: 'Outfit', 'Inter', sans-serif;
                    text-align: center;
                    padding: 20px;
                `;
                overlay.innerHTML = `
                    <div style="background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 24px; padding: 40px 32px; max-width: 480px; width: 90%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); backdrop-filter: blur(12px);">
                        <div style="width: 80px; height: 80px; margin: 0 auto 20px; background: rgba(56, 189, 248, 0.12); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                            <i class="fa-solid fa-cloud-arrow-down fa-bounce" style="font-size: 38px; color: #38bdf8;"></i>
                        </div>
                        <h2 style="font-size: 1.55rem; font-weight: 800; margin-bottom: 10px; color: #f8fafc;">Uygulama Güncelleniyor</h2>
                        <p id="loginUpdateMsg" style="font-size: 0.95rem; color: #94a3b8; line-height: 1.6; margin-bottom: 24px;">
                            Yeni sürüm (${updateInfo.remote_version || 'v3.1.x'}) tespit edildi. Güncelleme paketleri indiriliyor ve sisteme entegre ediliyor...
                        </p>
                        <div style="width: 100%; height: 8px; background: #334155; border-radius: 999px; overflow: hidden; position: relative;">
                            <div id="loginUpdateBar" style="width: 45%; height: 100%; background: linear-gradient(90deg, #38bdf8, #3b82f6); border-radius: 999px; transition: width 0.4s ease; animation: updateProgressAnim 1.8s infinite linear;"></div>
                        </div>
                        <p id="loginUpdateSub" style="font-size: 0.82rem; color: #64748b; margin-top: 18px; font-weight: 500;">
                            <i class="fa-solid fa-circle-info" style="color: #38bdf8; margin-right: 4px;"></i> İşlem tamamlandığında program sıfırdan otomatik başlatılacaktır.
                        </p>
                    </div>
                    <style>
                        @keyframes updateProgressAnim {
                            0% { transform: translateX(-100%); width: 30%; }
                            50% { width: 60%; }
                            100% { transform: translateX(350%); width: 30%; }
                        }
                    </style>
                `;
                document.body.appendChild(overlay);
            }

            fetch('/api/system/apply_update', { method: 'POST' })
                .then(res => res.json())
                .then(async data => {
                    const msgEl = document.getElementById('loginUpdateMsg');
                    const barEl = document.getElementById('loginUpdateBar');
                    const subEl = document.getElementById('loginUpdateSub');

                    if (data.success && data.updated) {
                        if (barEl) {
                            barEl.style.animation = 'none';
                            barEl.style.width = '100%';
                        }
                        if (msgEl) {
                            msgEl.style.color = '#4ade80';
                            msgEl.innerHTML = '<strong>✅ Güncelleme Başarıyla Tamamlandı!</strong><br>Program sıfırdan yeniden başlatılıyor...';
                        }
                        if (subEl) subEl.textContent = 'Yeni sistem yükleniyor, lütfen bekleyin...';

                        await new Promise(r => setTimeout(r, 2200));
                        for (let i = 0; i < 30; i++) {
                            await new Promise(r => setTimeout(r, 800));
                            try {
                                const ping = await fetch('/api/system/heartbeat', { method: 'POST' });
                                if (ping.ok) break;
                            } catch (_) {}
                        }
                        window.location.reload(true);
                    } else {
                        if (msgEl) msgEl.textContent = data.message || "Sistem zaten güncel.";
                        setTimeout(() => { if (overlay) overlay.remove(); }, 1200);
                    }
                })
                .catch(err => {
                    console.error("Login apply update error:", err);
                    setTimeout(() => { if (overlay) overlay.remove(); }, 2000);
                });
        }

        let workerQrScanner = null;
        async function openWorkerQrScanner() {
            const modal = document.getElementById('workerScannerModal');
            if (modal) modal.style.display = 'flex';
            const statusEl = document.getElementById('worker-scan-status');
            try {
                if (!workerQrScanner) {
                    workerQrScanner = new Html5Qrcode("worker-qr-reader");
                }
                await workerQrScanner.start(
                    { facingMode: "environment" },
                    { fps: 20, qrbox: { width: 250, height: 250 } },
                    (decodedText) => {
                        if (decodedText && (decodedText.includes('/mobile_login?token=') || decodedText.includes('token='))) {
                            statusEl.innerHTML = '<span style="color:#10b981; font-weight:800;">⚡ Karekod Okundu! Giriş Yapılıyor...</span>';
                            workerQrScanner.stop().catch(() => {});
                            window.location.href = decodedText;
                        }
                    },
                    () => {}
                );
                statusEl.textContent = "Karekod Bekleniyor... Masaüstündeki QR kodu gösteriniz.";
            } catch (e) {
                console.error("Camera error:", e);
                statusEl.innerHTML = '<span style="color:#ef4444;">Kamera açılamadı. Kamera izinlerini kontrol ediniz.</span>';
            }
        }

        function closeWorkerQrScanner() {
            const modal = document.getElementById('workerScannerModal');
            if (modal) modal.style.display = 'none';
            if (workerQrScanner) {
                workerQrScanner.stop().catch(() => {});
            }
        }
    </script>

    <!-- PERSONEL QR TARAYICI MODALI -->
    <div id="workerScannerModal" class="modal" style="display:none; position:fixed; z-index:99999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.8); backdrop-filter:blur(6px); align-items:center; justify-content:center;">
        <div style="background:#1e293b; color:#fff; max-width:440px; width:92%; margin:5% auto; padding:22px; border-radius:20px; border:1px solid rgba(255,255,255,0.15); box-shadow:0 25px 50px rgba(0,0,0,0.7); position:relative; text-align:center;">
            <span onclick="closeWorkerQrScanner()" style="position:absolute; right:18px; top:16px; cursor:pointer; font-size:1.6rem; color:#94a3b8;" title="Kapat">&times;</span>
            <h3 style="font-family:var(--font-outfit); font-size:1.2rem; font-weight:700; margin-bottom:6px;">Personel QR Girişi</h3>
            <p style="font-size:0.82rem; color:#94a3b8; margin-bottom:14px;">Masaüstü ekranındaki 24 saatlik karekodu kameraya gösteriniz.</p>
            <div id="worker-qr-reader" style="width:100%; min-height:260px; background:#000; border-radius:14px; overflow:hidden;"></div>
            <div id="worker-scan-status" style="font-size:0.8rem; color:#38bdf8; margin-top:10px; font-weight:600;">Kamera Açılıyor...</div>
        </div>
    </div>

    <script src="/static/device_tracker.js"></script>
</body>
</html>
